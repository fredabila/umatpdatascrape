<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admitted Students List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #3498db;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }
        @-webkit-keyframes spinner {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start px-4 py-8">
    <div class="container max-w-6xl mx-auto">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden mb-6">
            <div class="bg-green-600 text-white py-4 px-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Admitted Students List</h2>
                    <div class="flex items-center gap-4">
                        <button onclick="fetchAdmittedStudents()" 
                            class="bg-white text-green-600 px-4 py-2 rounded-md hover:bg-green-100 transition duration-300">
                            Refresh List
                        </button>
                        <button onclick="exportSelectedNumbers()" 
                            class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition duration-300">
                            Export Selected
                        </button>
                        <button onclick="deleteSelectedStudents()" 
                            class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 transition duration-300">
                            Delete Selected
                        </button>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <input type="text" id="searchInput" placeholder="Search by name, form ref..." 
                        class="px-4 py-2 rounded-md text-gray-800 flex-1" 
                        oninput="handleSearch()">
                    <select id="programFilter" onchange="handleProgramFilter()" 
                        class="px-4 py-2 rounded-md text-gray-800 min-w-[250px]">
                        <option value="">All Programs</option>
                    </select>
                    <select id="campusFilter" onchange="handleCampusFilter()" 
                        class="px-4 py-2 rounded-md text-gray-800 min-w-[200px]">
                        <option value="">All Campuses</option>
                    </select>
                    <select id="typeFilter" onchange="handleTypeFilter()" 
                        class="px-4 py-2 rounded-md text-gray-800 min-w-[200px]">
                        <option value="">All Application Types</option>
                    </select>
                </div>
            </div>
            <div class="p-6">
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="py-2 px-4 border-b text-left">
                                    <input type="checkbox" id="selectAll" onclick="toggleSelectAll()">
                                </th>
                                <th class="py-2 px-4 border-b text-left">Photo</th>
                                <th class="py-2 px-4 border-b text-left">Form Reference</th>
                                <th class="py-2 px-4 border-b text-left">Applicant</th>
                                <th class="py-2 px-4 border-b text-left">Application Type</th>
                                <th class="py-2 px-4 border-b text-left">Programme</th>
                                <th class="py-2 px-4 border-b text-left">Campus</th>
                                <th class="py-2 px-4 border-b text-left">Hall</th>
                                <th class="py-2 px-4 border-b text-left">Admitted</th>
                                <th class="py-2 px-4 border-b text-left">Status</th>
                                <th class="py-2 px-4 border-b text-left">Actions</th>
                                <th class="py-2 px-4 border-b text-left">Delete</th>
                            </tr>
                        </thead>
                        <tbody id="admittedStudentsTableBody">
                            <!-- Table rows will be dynamically inserted here -->
                        </tbody>
                    </table>
                </div>
                <div class="mt-4 flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <label for="itemsPerPage" class="text-gray-600">Items per page:</label>
                        <select id="itemsPerPage" onchange="changeItemsPerPage()" 
                            class="border rounded-md px-2 py-1 text-gray-600">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100" selected>100</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-4">
                        <button id="prevButton" onclick="changePage(-1)" 
                            class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition duration-300">Previous</button>
                        <span id="pageInfo" class="text-gray-600"></span>
                        <button id="nextButton" onclick="changePage(1)" 
                            class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600 transition duration-300">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loader" class="hidden fixed top-0 left-0 right-0 bottom-0 w-full h-screen z-50 overflow-hidden bg-gray-700 opacity-75 flex flex-col items-center justify-center">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
        <h2 class="text-center text-white text-xl font-semibold">Loading...</h2>
        <p class="w-1/3 text-center text-white">This may take a few seconds, please don't close this page.</p>
    </div>

    <script>
        let admittedStudents = [];
        let currentPage = 1;
        let studentsPerPage = 100;
        let filteredStudents = [];
        let deletedStudents = new Set(JSON.parse(localStorage.getItem('deletedStudents') || '[]'));
        let totalPages = 1;
        let totalItems = 0;
        let hasPreviousPage = false;
        let hasNextPage = false;
        let searchTerm = '';
        let selectedProgram = '';
        let selectedCampus = '';
        let selectedType = '';
        let allPrograms = new Set();
        let allCampuses = new Set();
        let allTypes = new Set();

        const API_BASE = 'https://apply.umat.edu.gh/api/admitted-applicants';
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

        function buildApiUrl() {
            // The API expects a non-empty searchText; a single space (+) matches everything.
            const searchText = searchTerm.trim() ? encodeURIComponent(searchTerm.trim()) : '+';
            return `${API_BASE}?searchText=${searchText}&page=${currentPage}` +
                `&pageSize=${studentsPerPage}&sortBy=admittedDate&sortOrder=desc`;
        }

        // Call the API directly, falling back to a CORS proxy when the browser blocks it.
        async function requestAdmittedApplicants() {
            const apiUrl = buildApiUrl();
            try {
                const response = await fetch(apiUrl, { headers: { Accept: 'application/json' } });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (directError) {
                console.warn('Direct request failed, retrying through proxy:', directError);
                const response = await fetch(`${CORS_PROXY}${encodeURIComponent(apiUrl)}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            }
        }

        async function fetchAdmittedStudents() {
            const loader = document.getElementById('loader');
            loader.classList.remove('hidden');

            try {
                const responseData = await requestAdmittedApplicants();
                const data = responseData.data || {};
                admittedStudents = data.items || [];
                totalPages = data.totalPages || 1;
                totalItems = data.totalItems || 0;
                currentPage = data.page || currentPage;
                hasPreviousPage = data.hasPreviousPage !== undefined
                    ? data.hasPreviousPage
                    : currentPage > 1;
                hasNextPage = data.hasNextPage !== undefined
                    ? data.hasNextPage
                    : currentPage < totalPages;

                // Collect unique programmes, campuses and application types
                admittedStudents.forEach(student => {
                    if (student.programme) allPrograms.add(student.programme);
                    if (student.campus) allCampuses.add(student.campus);
                    if (student.applicationType) allTypes.add(student.applicationType);
                });

                populateFilters();
                displayAdmittedStudents();
            } catch (error) {
                console.error('Error fetching admitted students:', error);
                alert('An error occurred while fetching data. Please try again.');
            } finally {
                loader.classList.add('hidden');
            }
        }

        function displayAdmittedStudents() {
            const tableBody = document.getElementById('admittedStudentsTableBody');
            
            // Filter out deleted students and apply program/campus filters
            let displayedStudents = admittedStudents.filter(student => {
                if (deletedStudents.has(student.formReferenceNo)) return false;
                if (selectedProgram && student.programme !== selectedProgram) return false;
                if (selectedCampus && student.campus !== selectedCampus) return false;
                if (selectedType && student.applicationType !== selectedType) return false;
                return true;
            });

            tableBody.innerHTML = '';
            
            if (displayedStudents.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="12" class="py-4 px-4 text-center text-gray-500">
                            No students found matching the selected filters
                        </td>
                    </tr>
                `;
                updatePageInfo(0);
                return;
            }
            
            displayedStudents.forEach((student, index) => {
                const whatsAppLink = getWhatsAppLink(student.phoneNumber);
                const row = `
                    <tr>
                        <td class="py-2 px-4 border-b">
                            <input type="checkbox" class="student-checkbox" 
                                data-student-id="${escapeHtml(student.formReferenceNo)}"
                                data-applicant-id="${escapeHtml(student.id)}"
                                data-phone-number="${escapeHtml(student.phoneNumber)}"
                                data-full-name="${escapeHtml(student.fullName)}"
                                data-index="${index}">
                        </td>
                        <td class="py-2 px-4 border-b">
                            ${student.profileImageUrl
                                ? `<img src="${escapeHtml(student.profileImageUrl)}" alt="${escapeHtml(student.fullName)}"
                                        class="h-10 w-10 rounded-full object-cover bg-gray-200"
                                        loading="lazy" referrerpolicy="no-referrer"
                                        onerror="this.style.display='none'">`
                                : '<div class="h-10 w-10 rounded-full bg-gray-200"></div>'}
                        </td>
                        <td class="py-2 px-4 border-b whitespace-nowrap">${escapeHtml(student.formReferenceNo)}</td>
                        <td class="py-2 px-4 border-b">
                            <div class="font-medium">${escapeHtml(student.fullName)}</div>
                            <div class="text-sm text-gray-500">${escapeHtml(student.email) || 'No email'}</div>
                            <div class="text-sm text-gray-500">${escapeHtml(student.phoneNumber) || 'No phone'}</div>
                        </td>
                        <td class="py-2 px-4 border-b">${escapeHtml(student.applicationType) || 'N/A'}</td>
                        <td class="py-2 px-4 border-b">
                            <div>${escapeHtml(student.programme) || 'N/A'}</div>
                            ${student.programmeCode
                                ? `<div class="text-sm text-gray-500">${escapeHtml(student.programmeCode)}</div>`
                                : ''}
                        </td>
                        <td class="py-2 px-4 border-b">${escapeHtml(student.campus) || 'N/A'}</td>
                        <td class="py-2 px-4 border-b">
                            <div>${escapeHtml(student.hallName) || 'N/A'}</div>
                            ${student.affiliatedHallName
                                ? `<div class="text-sm text-gray-500">${escapeHtml(student.affiliatedHallName)}</div>`
                                : ''}
                        </td>
                        <td class="py-2 px-4 border-b whitespace-nowrap">
                            <div>${formatDate(student.admittedDate)}</div>
                            <div class="text-sm text-gray-500">
                                ${escapeHtml(student.admittedYear) || ''}${student.batchNumber ? ` &middot; Batch ${escapeHtml(student.batchNumber)}` : ''}
                            </div>
                        </td>
                        <td class="py-2 px-4 border-b whitespace-nowrap">
                            <span class="inline-block px-2 py-1 rounded-full text-xs ${statusClass(student.statusCode)}">
                                ${escapeHtml(student.status) || 'Unknown'}
                            </span>
                            ${student.feeStatus
                                ? `<div class="text-sm text-gray-500 mt-1 capitalize">${escapeHtml(student.feeStatus)} fees</div>`
                                : ''}
                        </td>
                        <td class="py-2 px-4 border-b">
                            ${whatsAppLink
                                ? `<a href="${whatsAppLink}" target="_blank" 
                                        class="bg-green-500 text-white px-2 py-1 rounded-md hover:bg-green-600 transition duration-300">
                                        WhatsApp
                                    </a>`
                                : '<span class="text-gray-400 text-sm">No phone</span>'}
                        </td>
                        <td class="py-2 px-4 border-b">
                            <button onclick="deleteStudent('${escapeHtml(student.formReferenceNo)}')"
                                class="bg-red-500 text-white px-2 py-1 rounded-md hover:bg-red-600 transition duration-300">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });

            updatePageInfo(displayedStudents.length);
        }

        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDate(value) {
            if (!value) return 'N/A';
            const date = new Date(value);
            return isNaN(date.getTime()) ? escapeHtml(value) : date.toLocaleDateString();
        }

        function statusClass(statusCode) {
            switch ((statusCode || '').toLowerCase()) {
                case 'admitted': return 'bg-green-100 text-green-800';
                case 'pending': return 'bg-yellow-100 text-yellow-800';
                case 'rejected': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        function getWhatsAppLink(phoneNumber) {
            const cleanNumber = getWhatsAppNumber(phoneNumber);
            return cleanNumber ? `https://wa.me/${cleanNumber}` : '';
        }

        function updatePageInfo(filteredCount = null) {
            const pageInfo = document.getElementById('pageInfo');
            const displayCount = filteredCount !== null ? filteredCount : admittedStudents.length;
            const filterText = (selectedProgram || selectedCampus || selectedType) ? ` (${displayCount} filtered)` : '';
            pageInfo.textContent = `Page ${currentPage} of ${totalPages} (${totalItems} total${filterText})`;

            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            const noPrev = !hasPreviousPage || currentPage === 1;
            const noNext = !hasNextPage || currentPage >= totalPages;
            prevButton.disabled = noPrev;
            nextButton.disabled = noNext;
            prevButton.classList.toggle('opacity-50', noPrev);
            nextButton.classList.toggle('opacity-50', noNext);
        }

        function changePage(delta) {
            const newPage = currentPage + delta;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                fetchAdmittedStudents();
            }
        }

        let searchDebounce = null;

        function handleSearch() {
            searchTerm = document.getElementById('searchInput').value;
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(() => {
                currentPage = 1;
                fetchAdmittedStudents();
            }, 400);
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.student-checkbox');
            checkboxes.forEach(checkbox => checkbox.checked = selectAll.checked);
        }

        function exportSelectedNumbers() {
            const checkboxes = document.querySelectorAll('.student-checkbox:checked');
            const selectedNumbers = Array.from(checkboxes).map(checkbox => {
                const studentId = checkbox.dataset.studentId;
                const phoneNumber = checkbox.dataset.phoneNumber;
                
                const cleanNumber = getWhatsAppNumber(phoneNumber);
                if (!cleanNumber) {
                    console.error('Phone number not found for student:', studentId);
                    return null;
                }
                
                // Add to deleted/tracked list after export
                deletedStudents.add(studentId);
                return "+" + cleanNumber;
            }).filter(number => number !== null);

            if (selectedNumbers.length === 0) {
                alert('Please select at least one student to export');
                return;
            }

            // Save updated deletedStudents to localStorage
            localStorage.setItem('deletedStudents', JSON.stringify([...deletedStudents]));

            const csvContent = selectedNumbers.join(',');
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'phone_numbers.csv';
            a.click();
            window.URL.revokeObjectURL(url);
            
            // Refresh the display to remove exported students
            displayAdmittedStudents();
        }

        function getWhatsAppNumber(phoneNumber) {
            if (!phoneNumber) return '';
            let cleanNumber = String(phoneNumber).replace(/\D/g, '');
            if (!cleanNumber) return '';
            if (cleanNumber.startsWith('0')) {
                cleanNumber = '233' + cleanNumber.slice(1);
            } else if (!cleanNumber.startsWith('233')) {
                cleanNumber = '233' + cleanNumber;
            }
            return cleanNumber;
        }

        function changeItemsPerPage() {
            const select = document.getElementById('itemsPerPage');
            studentsPerPage = parseInt(select.value);
            currentPage = 1;
            fetchAdmittedStudents();
        }

        function deleteStudent(studentId) {
            if (confirm('Are you sure you want to delete this student from the list?')) {
                deletedStudents.add(studentId);
                localStorage.setItem('deletedStudents', JSON.stringify([...deletedStudents]));
                displayAdmittedStudents();
            }
        }

        function populateFilters() {
            // Populate program filter
            const programFilter = document.getElementById('programFilter');
            const currentProgram = programFilter.value;
            
            // Keep "All Programs" option and add unique programs
            const programOptions = ['<option value="">All Programs</option>'];
            Array.from(allPrograms).sort().forEach(program => {
                programOptions.push(`<option value="${escapeHtml(program)}" ${program === currentProgram ? 'selected' : ''}>${escapeHtml(program)}</option>`);
            });
            programFilter.innerHTML = programOptions.join('');
            
            // Populate campus filter
            const campusFilter = document.getElementById('campusFilter');
            const currentCampus = campusFilter.value;
            
            const campusOptions = ['<option value="">All Campuses</option>'];
            Array.from(allCampuses).sort().forEach(campus => {
                campusOptions.push(`<option value="${escapeHtml(campus)}" ${campus === currentCampus ? 'selected' : ''}>${escapeHtml(campus)}</option>`);
            });
            campusFilter.innerHTML = campusOptions.join('');

            // Populate application type filter
            const typeFilter = document.getElementById('typeFilter');
            const currentType = typeFilter.value;

            const typeOptions = ['<option value="">All Application Types</option>'];
            Array.from(allTypes).sort().forEach(type => {
                typeOptions.push(`<option value="${escapeHtml(type)}" ${type === currentType ? 'selected' : ''}>${escapeHtml(type)}</option>`);
            });
            typeFilter.innerHTML = typeOptions.join('');
        }

        function handleProgramFilter() {
            const programFilter = document.getElementById('programFilter');
            selectedProgram = programFilter.value;
            displayAdmittedStudents();
        }

        function handleCampusFilter() {
            const campusFilter = document.getElementById('campusFilter');
            selectedCampus = campusFilter.value;
            displayAdmittedStudents();
        }

        function handleTypeFilter() {
            const typeFilter = document.getElementById('typeFilter');
            selectedType = typeFilter.value;
            displayAdmittedStudents();
        }

        function deleteSelectedStudents() {
            const checkboxes = document.querySelectorAll('.student-checkbox:checked');
            
            if (checkboxes.length === 0) {
                alert('Please select at least one student to delete');
                return;
            }

            if (confirm(`Are you sure you want to delete ${checkboxes.length} selected student(s)?`)) {
                checkboxes.forEach(checkbox => {
                    const studentId = checkbox.getAttribute('data-student-id');
                    if (studentId) {
                        deletedStudents.add(studentId);
                    }
                });

                // Save updated deletedStudents to localStorage
                localStorage.setItem('deletedStudents', JSON.stringify([...deletedStudents]));
                
                // Reset the select all checkbox
                document.getElementById('selectAll').checked = false;
                
                // Refresh the display
                displayAdmittedStudents();
            }
        }

        // Initial fetch of admitted students
        fetchAdmittedStudents();
    </script>
</body>
</html>
